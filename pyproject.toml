[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "braillebase"
version = "0.2.9"
description = "A complete and extensible Unicode Braille processing library."
authors = [
    { name = "Nagao Yuji" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6"

keywords = [
    "braille",
    "unicode",
    "accessibility",
    "API",
    "binary",
    "blind",
    "education"
]

dependencies = [
    "brailletable>=1.0.2",
    "braillebaseuniversalset>=1.0.0",
    "braillebaseoutputstring>=1.0.0",
    "braillebaseio>=1.0.3"
]

[project.urls]
Homepage = "https://braillebase.blogspot.com/2026/06/readme.html"
Documentation = "https://github.com/DukaCrazy/braillebase"
Source = "https://github.com/DukaCrazy/braillebase"
