[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "braillebase"
version = "0.2.0"
description = "A complete and extensible Unicode Braille processing library."
authors = [
    { name = "Nagao Yuji" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"
keywords = ["braille", "unicode", "accessibility", "API", "binary", "blind", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "brailletable>=1.0.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://braillebase.blogspot.com/2026/06/readme.html"
Documentation = "https://github.com/DukaCrazy/braillebase"
Source = "https://github.com/DukaCrazy/braillebase"

[tool.setuptools]
packages = ["braillebase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
